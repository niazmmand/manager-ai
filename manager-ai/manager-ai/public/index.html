<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دستیار تحلیلی مدیران</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161d; --surface:#1b212b; --surface-2:#232b37; --line:#2c3644;
    --gold:#c9a227; --gold-dim:#8a7020; --teal:#4e7c74;
    --text:#ede9e0; --text-dim:#8b93a1; --text-faint:#545e6c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg);color:var(--text);font-family:'Vazirmatn',sans-serif;display:flex;min-height:100vh;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .app{display:flex;width:100%;height:100vh;}
  .main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0;}
  .chat-header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .chat-header h1{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px;}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(201,162,39,.6);}
  .chat-header a{color:var(--text-faint);font-size:11.5px;text-decoration:none;}
  .chat-body{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:20px;}
  .empty-state{margin:auto;text-align:center;max-width:480px;color:var(--text-dim);}
  .empty-state .big{font-size:20px;font-weight:900;color:var(--text);margin-bottom:10px;}
  .msg{max-width:720px;}
  .msg.user{align-self:flex-end;}
  .msg.assistant{align-self:flex-start;}
  .msg-bubble{padding:14px 18px;border-radius:14px;font-size:14px;line-height:2;white-space:pre-wrap;}
  .msg.user .msg-bubble{background:var(--gold);color:#1a1508;border-bottom-left-radius:4px;font-weight:500;}
  .msg.assistant .msg-bubble{background:var(--surface);border:1px solid var(--line);border-bottom-right-radius:4px;}
  .sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .source-tag{font-size:10.5px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--line);padding:4px 9px;border-radius:20px;}
  .thinking{color:var(--text-faint);font-size:12.5px;padding:6px 0;}
  .chat-input-area{border-top:1px solid var(--line);padding:16px 28px 22px;background:var(--bg);}
  .input-row{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 10px;}
  .input-row:focus-within{border-color:var(--gold-dim);}
  textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:14px;resize:none;padding:10px 6px;max-height:140px;line-height:1.7;}
  .send-btn{background:var(--gold);color:#1a1508;border:none;width:38px;height:38px;border-radius:10px;cursor:pointer;flex-shrink:0;align-self:flex-end;margin-bottom:4px;}
  .send-btn:disabled{opacity:.35;cursor:not-allowed;}
  .input-hint{font-size:10.5px;color:var(--text-faint);margin-top:8px;text-align:center;}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="chat-header">
      <h1><span class="brand-dot"></span>دستیار تحلیلی مدیران</h1>
      <a href="/admin.html">پنل افزودن محتوا ←</a>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="empty-state" id="emptyState">
        <div class="big">امروز با چه چالشی روبه‌رو هستید؟</div>
        <div>سؤالتان را بنویسید تا بر اساس کتابخانه‌ی محتوای شما تحلیل شود.</div>
      </div>
    </div>
    <div class="chat-input-area">
      <div class="input-row">
        <textarea id="input" placeholder="سؤال یا چالش مدیریتی‌تان را بنویسید…" rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
      <div class="input-hint">پاسخ‌ها بر اساس محتوایی است که در پنل مدیریت اضافه کرده‌اید.</div>
    </div>
  </main>
</div>
<script>
const chatBody = document.getElementById('chatBody');
const emptyState = document.getElementById('emptyState');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function handleKey(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
}
function addUserMsg(text){
  if(emptyState) emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="msg-bubble"></div>';
  div.querySelector('.msg-bubble').textContent = text;
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}
function addAssistantMsg(text, sources){
  const div = document.createElement('div');
  div.className = 'msg assistant';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  if(sources && sources.length){
    const wrap = document.createElement('div');
    wrap.className = 'sources';
    sources.forEach(s=>{
      const tag = document.createElement('div');
      tag.className = 'source-tag';
      tag.textContent = s.title;
      wrap.appendChild(tag);
    });
    div.appendChild(wrap);
  }
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}
function addThinking(){
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'thinkingMsg';
  div.innerHTML = '<div class="thinking">در حال تحلیل کتابخانه محتوا…</div>';
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}
function removeThinking(){
  const el = document.getElementById('thinkingMsg');
  if(el) el.remove();
}
async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addUserMsg(text);
  addThinking();
  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    removeThinking();
    if(!res.ok){ addAssistantMsg('خطا: ' + (data.error || 'نامشخص'), []); }
    else{ addAssistantMsg(data.answer, data.sources); }
  } catch(err){
    removeThinking();
    addAssistantMsg('خطا در اتصال به سرور: ' + err.message, []);
  } finally {
    sendBtn.disabled = false;
  }
}
</script>
</body>
</html>
